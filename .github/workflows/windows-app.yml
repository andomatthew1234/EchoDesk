name: EchoDesk Desktop Windows Build

# Ordinary CI runs only create artifacts. Publishing is available solely from
# an explicit manual dispatch and only to a release that already exists.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-app.yml'
      - 'desktop/**'
      - 'companion-windows/**'
      - 'src/**'
      - 'scripts/build_freenove_firmware.ps1'
      - 'scripts/package_echodesk_firmware.ps1'
      - 'scripts/test_echodesk_firmware_package.ps1'
      - 'platformio.ini'
  pull_request:
    paths:
      - '.github/workflows/windows-app.yml'
      - 'desktop/**'
      - 'companion-windows/**'
      - 'src/**'
      - 'scripts/build_freenove_firmware.ps1'
      - 'scripts/package_echodesk_firmware.ps1'
      - 'scripts/test_echodesk_firmware_package.ps1'
      - 'platformio.ini'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload verified assets to an existing GitHub Release'
        type: boolean
        required: true
        default: false
      tag:
        description: 'Existing release tag ending in v0.2.6 (only when uploading)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: echodesk-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DESKTOP_VERSION: '0.2.6'
  CODEXBAR_VERSION: '0.70.0'
  CODEXBAR_ARCHIVE_SHA256: '79C3AA5B01B0CAD92BE0BED108CA1A97A901DF8B3998319272DBBDBA44FD3AE4'
  CODEXBAR_EXE_SHA256: 'F81570B0CD7593ABB9822EB2362F9B9EDA3A382A571457718EE37E664E9A62FC'
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: companion-windows/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion-windows -> target

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install PlatformIO and NSIS
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check platformio==6.1.18
          $platformioPython = (Get-Command python.exe -ErrorAction Stop).Source
          "PLATFORMIO_PYTHON=$platformioPython" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          choco install nsis --version=3.13.0 -y --no-progress
          $nsis = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $nsis) { throw 'NSIS makensis.exe was not installed.' }
          "NSIS_COMPILER=$nsis" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install host frontend dependencies
        working-directory: companion-windows
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build merged EchoDesk Mini firmware
        shell: pwsh
        run: .\scripts\build_freenove_firmware.ps1

      - name: Test firmware release packaging
        shell: pwsh
        run: >-
          .\scripts\test_echodesk_firmware_package.ps1
          -SourceFirmware .\desktop\firmware\echodesk-mini\2.31.0\echodesk-os.bin

      - name: Test Rust workspace
        working-directory: companion-windows
        run: cargo test --workspace --locked

      - name: Build release host
        working-directory: companion-windows
        run: cargo build --package aimonitor --release --locked

      - name: Build and test WPF desktop
        shell: pwsh
        run: |
          dotnet build .\desktop\EchoDesk.Desktop.sln -c Release
          dotnet run --project .\desktop\tests\EchoDesk.Desktop.Tests\EchoDesk.Desktop.Tests.csproj -c Release --no-build

      - name: Download and verify CLI-only Codex provider
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "CodexBarCLI-v$env:CODEXBAR_VERSION-windows-x64.zip"
          $url = "https://github.com/nesszer/Win-CodexBar/releases/download/v$env:CODEXBAR_VERSION/CodexBarCLI-v$env:CODEXBAR_VERSION-windows-x64.zip"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $archive
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($archiveHash -ne $env:CODEXBAR_ARCHIVE_SHA256) { throw "Codex provider archive digest mismatch: $archiveHash" }
          $extract = Join-Path $env:RUNNER_TEMP 'echodesk-codexbar-cli'
          Expand-Archive $archive -DestinationPath $extract -Force
          $cli = Get-ChildItem $extract -Recurse -File -Filter codexbar-cli.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $cli) { throw 'The pinned archive did not contain codexbar-cli.exe.' }
          $cliHash = (Get-FileHash $cli -Algorithm SHA256).Hash
          if ($cliHash -ne $env:CODEXBAR_EXE_SHA256) { throw "Codex provider executable digest mismatch: $cliHash" }
          $reported = (& $cli --version | Select-Object -First 1) -join ''
          if ($LASTEXITCODE -ne 0 -or $reported -notmatch [regex]::Escape($env:CODEXBAR_VERSION)) { throw "Unexpected Codex provider version: $reported" }
          "CODEXBAR_CLI=$cli" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build EchoDesk Desktop v0.2 package and installer
        shell: pwsh
        run: |
          .\desktop\build.ps1 `
            -HostExecutable .\companion-windows\target\release\aimonitor.exe `
            -CodexBarCli $env:CODEXBAR_CLI `
            -NsisCompiler $env:NSIS_COMPILER `
            -RequireInstaller

      - name: Prepare Azure Trusted Signing
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: cargo install trusted-signing-cli --locked

      - name: Sign setup with Azure Trusted Signing
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          $setup = Resolve-Path ".\desktop\dist\EchoDesk-Desktop-v$env:DESKTOP_VERSION-win-x64-setup.exe"
          trusted-signing-cli -e $env:AZURE_SIGNING_ENDPOINT -a $env:AZURE_SIGNING_ACCOUNT -c $env:AZURE_SIGNING_PROFILE -d 'EchoDesk Desktop' $setup
          if ($LASTEXITCODE -ne 0) { throw 'Azure Trusted Signing failed.' }

      - name: Sign setup with PFX certificate
        if: env.AZURE_CLIENT_ID == '' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'echodesk-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -File -Filter signtool.exe |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' | Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'Windows SDK signtool.exe was not found.' }
          $setup = Resolve-Path ".\desktop\dist\EchoDesk-Desktop-v$env:DESKTOP_VERSION-win-x64-setup.exe"
          & $signtool sign /sha1 $certificate.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed.' }

      - name: Finalize and verify release checksums
        shell: pwsh
        run: |
          $dist = Resolve-Path '.\desktop\dist'
          $assets = @(
            "EchoDesk-Desktop-v$env:DESKTOP_VERSION-win-x64.zip",
            "EchoDesk-Desktop-v$env:DESKTOP_VERSION-win-x64-setup.exe"
          )
          foreach ($name in $assets) {
            $path = Join-Path $dist $name
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing release asset: $path" }
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash
            Set-Content "$path.sha256" -Value "$hash  $name" -Encoding ascii
            Write-Host "$hash  $name"
          }
          $component = Get-Content (Join-Path $dist 'EchoDesk-Desktop-win-x64\component-manifest.json') -Raw | ConvertFrom-Json
          if ($component.packageVersion -ne $env:DESKTOP_VERSION) { throw 'Component manifest version mismatch.' }
          if ($component.flashEngine -ne 'espflash-in-process') { throw 'Unexpected firmware flashing engine.' }

      - name: Smoke-test silent per-user install and uninstall
        shell: pwsh
        run: |
          $setup = Resolve-Path ".\desktop\dist\EchoDesk-Desktop-v$env:DESKTOP_VERSION-win-x64-setup.exe"
          $process = Start-Process $setup -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)." }
          $install = Join-Path $env:LOCALAPPDATA 'Programs\EchoDesk Desktop'
          $required = @(
            'EchoDesk Desktop.exe',
            'EchoDesk Host.exe',
            'components\codexbar-cli.exe',
            'firmware\firmware-manifest.json',
            'firmware\firmware-manifest.json.sha256',
            'Uninstall EchoDesk Desktop.exe'
          )
          foreach ($relative in $required) {
            $path = Join-Path $install $relative
            if (-not (Test-Path $path -PathType Leaf)) { throw "Installed file missing: $path" }
          }
          $firmwareManifest = Get-Content (Join-Path $install 'firmware\firmware-manifest.json') -Raw | ConvertFrom-Json
          $firmwareImage = Join-Path (Join-Path $install 'firmware') ($firmwareManifest.releases[0].imageFile -replace '/', [IO.Path]::DirectorySeparatorChar)
          if (-not (Test-Path $firmwareImage -PathType Leaf)) { throw "Installed firmware image missing: $firmwareImage" }
          $uninstaller = Join-Path $install 'Uninstall EchoDesk Desktop.exe'
          $process = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Uninstaller exited with $($process.ExitCode)." }
          Start-Sleep -Seconds 2
          if (Test-Path $install) { throw "Uninstaller left the installation directory behind: $install" }

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: EchoDesk-Desktop-v0.2.6-Windows
          path: |
            desktop/dist/EchoDesk-Desktop-v0.2.6-win-x64.zip
            desktop/dist/EchoDesk-Desktop-v0.2.6-win-x64.zip.sha256
            desktop/dist/EchoDesk-Desktop-v0.2.6-win-x64-setup.exe
            desktop/dist/EchoDesk-Desktop-v0.2.6-win-x64-setup.exe.sha256
            desktop/dist/EchoDesk-Desktop-win-x64/component-manifest.json
            desktop/dist/EchoDesk-Desktop-win-x64/firmware/firmware-manifest.json
            desktop/dist/EchoDesk-Desktop-win-x64/firmware/firmware-manifest.json.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Upload to an existing release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_release == true && inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v8
        with:
          name: EchoDesk-Desktop-v0.2.6-Windows
          path: release-assets

      - name: Validate explicit release target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ (^|-)v0\.2\.0$ ]]; then
            echo "::error::Release tag must end in v0.2.6; received '$RELEASE_TAG'."
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null || {
            echo "::error::Release '$RELEASE_TAG' does not already exist. This workflow never creates releases."
            exit 1
          }

      - name: Upload verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            release-assets/EchoDesk-Desktop-v0.2.6-win-x64.zip \
            release-assets/EchoDesk-Desktop-v0.2.6-win-x64.zip.sha256 \
            release-assets/EchoDesk-Desktop-v0.2.6-win-x64-setup.exe \
            release-assets/EchoDesk-Desktop-v0.2.6-win-x64-setup.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
