name: Build & Release Firmware

on:
  push:
    branches: [main]
    # Stable firmware uses major version 1 or newer. Desktop releases use
    # v0.x.y, so keep those tags out of the firmware release pipeline.
    tags: ['v[1-9]*', 'fw-beta-v*']
    paths:
      - 'src/**'
      - 'platformio.ini'
      - 'installer/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref_type == 'tag' && format('release-{0}', github.ref_name) || 'firmware-build' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Bei einem Release-Tag (v* / fw-beta-v*) muss APP_VERSION in src/config.h
      # exakt zum Tag passen, sonst wird eine falsch versionierte Firmware
      # released.
      - name: Verify firmware version matches tag
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/fw-beta-v')
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [[ "$REF" == fw-beta-v* ]]; then TAG="${REF#fw-beta-v}"; else TAG="${REF#v}"; fi
          CODE=$(grep '#define APP_VERSION' src/config.h | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$CODE" ]; then
            echo "::error::Tag $REF passt nicht zu APP_VERSION '$CODE' in src/config.h (erwartet $TAG)"
            exit 1
          fi
          echo "Version OK: $CODE"

      # Die Versionsangaben auf der Installer-Seite werden nicht automatisch
      # mitgezogen. Dieser Check verhindert, dass ein Release mit veralteten
      # Versionsnummern auf der Seite live geht.
      #
      # Bewusst nur bei Release-Tags: die Seite zeigt die veroeffentlichte
      # Version. Zwischen einer Versionsanhebung im Code und dem Release darf
      # sie also legitim hinterherhinken — sonst wuerde sie auf ein Release
      # verlinken, das es noch gar nicht gibt. Nur Stable-Tags (v*): die Seite
      # verlinkt kein Beta, wie im Windows-Workflow.
      - name: Verify site versions are in sync
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/sync_site_versions.sh --check

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Setup Rust for plugin scene contract
        uses: dtolnay/rust-toolchain@stable

      # Build + merge_bin (beide Panel-Varianten) + OTA-Copy + Manifest-Version:
      # gesamte Logik liegt in scripts/build_firmware.sh, damit lokaler Build und
      # CI nicht auseinanderlaufen (single source of truth).
      - name: Build & package firmware
        run: bash scripts/build_firmware.sh

      - name: Test display-plugin fixture scenes against firmware parser
        run: bash scripts/test_display_plugin_scene_contract.sh

      - name: Upload build artifacts for release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/fw-beta-v')
        uses: actions/upload-artifact@v7
        with:
          name: firmware-binaries
          path: |
            installer/bin/ai-monitor.bin
            installer/bin/firmware-ota.bin
            installer/bin/ai-monitor-st7789.bin
            installer/bin/firmware-ota-st7789.bin
            installer/bin/ai-monitor-st7701.bin
            installer/bin/firmware-ota-st7701.bin

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/fw-beta-v')
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware binaries
        uses: actions/download-artifact@v8
        with:
          name: firmware-binaries
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # fw-beta-v*-Tags werden als prerelease veroeffentlicht, damit der
          # Firmware-Updater sie nur im Beta-Kanal anbietet.
          prerelease: ${{ startsWith(github.ref, 'refs/tags/fw-beta-v') }}
          generate_release_notes: true
          files: |
            release-assets/ai-monitor.bin
            release-assets/firmware-ota.bin
            release-assets/ai-monitor-st7789.bin
            release-assets/firmware-ota-st7789.bin
            release-assets/ai-monitor-st7701.bin
            release-assets/firmware-ota-st7701.bin
