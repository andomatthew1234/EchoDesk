<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="672" height="512" viewBox="0 0 672 512">
  <title>EchoDesk OS 1.0 — 320 by 240 screen previews</title>
  <desc>Four exact-aspect preview panels for Home, Codex Usage, Melbourne Clock, and Settings. The Home panel includes Performance. Usage and clock values are explicitly marked as preview data.</desc>
  <style>
    .screen { fill: #000; stroke: #555; stroke-width: 1; }
    .panel { fill: #0e0e0e; stroke: #3c3c3c; stroke-width: 1; }
    .white { fill: #fff; }
    .grey { fill: #8a8a8a; }
    .dim { fill: #3c3c3c; }
    .label { font-family: Montserrat, Arial, sans-serif; }
    .mono { font-family: "Arial Narrow", Montserrat, Arial, sans-serif; }
    .hairline { stroke: #3c3c3c; stroke-width: 1; }
  </style>

  <rect width="672" height="512" fill="#151515"/>

  <!-- HOME — exact 320 x 240 panel -->
  <svg x="8" y="8" width="320" height="240" viewBox="0 0 320 240">
    <rect class="screen" x="0.5" y="0.5" width="319" height="239"/>

    <text x="12" y="28" class="label" font-size="20" font-weight="700"
          fill="#000" stroke="#fff" stroke-width="1.2" paint-order="stroke">ECHO</text>
    <text x="73" y="28" class="label white" font-size="20" font-weight="800" letter-spacing="1">DESK</text>
    <text x="308" y="23" class="label grey" font-size="12" text-anchor="end">OS  1.0</text>

    <g transform="translate(8 43)">
      <rect class="panel" width="146" height="82" rx="12"/>
      <rect x="8" y="9" width="32" height="32" rx="8" fill="none" stroke="#fff"/>
      <text x="24" y="30" class="label white" font-size="14" font-weight="700" text-anchor="middle">C</text>
      <text x="47" y="23" class="label white" font-size="14" font-weight="700">CODEX</text>
      <text x="9" y="70" class="label grey" font-size="12">Usage limits</text>
    </g>

    <g transform="translate(166 43)">
      <rect class="panel" width="146" height="82" rx="12"/>
      <rect x="8" y="9" width="32" height="32" rx="8" fill="none" stroke="#fff"/>
      <text x="24" y="30" class="label white" font-size="12" font-weight="700" text-anchor="middle">12</text>
      <text x="47" y="23" class="label white" font-size="14" font-weight="700">CLOCK</text>
      <text x="9" y="70" class="label grey" font-size="12">Local time</text>
    </g>

    <g transform="translate(8 133)">
      <rect class="panel" width="146" height="82" rx="12"/>
      <rect x="8" y="9" width="32" height="32" rx="8" fill="none" stroke="#fff"/>
      <text x="24" y="30" class="label white" font-size="14" font-weight="700" text-anchor="middle">^</text>
      <text x="47" y="23" class="label white" font-size="12" font-weight="700">PERFORMANCE</text>
      <text x="9" y="70" class="label grey" font-size="12">PC activity</text>
    </g>

    <g transform="translate(166 133)">
      <rect class="panel" width="146" height="82" rx="12"/>
      <rect x="8" y="9" width="32" height="32" rx="8" fill="none" stroke="#fff"/>
      <text x="24" y="30" class="label white" font-size="14" font-weight="700" text-anchor="middle">*</text>
      <text x="47" y="23" class="label white" font-size="13" font-weight="700">SETTINGS</text>
      <text x="9" y="70" class="label grey" font-size="12">Display &amp; restart</text>
    </g>
  </svg>

  <!-- CODEX — exact 320 x 240 panel; session is absent so Weekly is centred -->
  <svg x="344" y="8" width="320" height="240" viewBox="0 0 320 240">
    <rect class="screen" x="0.5" y="0.5" width="319" height="239"/>
    <g>
      <rect class="panel" x="8" y="6" width="66" height="28" rx="8"/>
      <text x="41" y="24" class="label white" font-size="12" text-anchor="middle">‹  HOME</text>
      <text x="160" y="25" class="label white" font-size="14" font-weight="700" text-anchor="middle">CODEX USAGE</text>
      <text x="310" y="23" class="label white" font-size="10" text-anchor="end">CONNECTED</text>
      <line x1="8" y1="39.5" x2="312" y2="39.5" class="hairline"/>
      <text x="10" y="53" class="label grey" font-size="11">PERCENT LEFT</text>
      <text x="310" y="53" class="label grey" font-size="9" text-anchor="end">PREVIEW · SESSION ABSENT</text>
    </g>

    <g transform="translate(8 92)">
      <rect width="304" height="83" rx="10" fill="#0e0e0e"/>
      <text x="12" y="23" class="label white" font-size="14" font-weight="700">WEEKLY</text>
      <text x="292" y="36" class="label white" font-size="36" font-weight="700" text-anchor="end">38%</text>
      <rect x="12" y="45" width="280" height="8" rx="4" fill="#3c3c3c"/>
      <rect x="12" y="45" width="106" height="8" rx="4" fill="#fff"/>
      <text x="12" y="75" class="label grey" font-size="12">RESET IN  5d 2h</text>
    </g>

    <!-- Preview-only legend for the real no-data state, where cards are hidden. -->
    <g transform="translate(170 184)">
      <rect width="140" height="47" rx="8" fill="#080808" stroke="#3c3c3c"/>
      <circle cx="22" cy="23" r="11" fill="none" stroke="#3c3c3c" stroke-width="3"/>
      <path d="M22 12 A11 11 0 0 1 33 23" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="42" y="19" class="label white" font-size="9" font-weight="700">WAIT STATE</text>
      <text x="42" y="34" class="label grey" font-size="8">Cards hidden</text>
    </g>
  </svg>

  <!-- CLOCK — exact 320 x 240 panel; shown time is a preview sample -->
  <svg x="8" y="264" width="320" height="240" viewBox="0 0 320 240">
    <rect class="screen" x="0.5" y="0.5" width="319" height="239"/>
    <rect class="panel" x="8" y="6" width="66" height="28" rx="8"/>
    <text x="41" y="24" class="label white" font-size="12" text-anchor="middle">‹  HOME</text>
    <text x="160" y="25" class="label white" font-size="14" font-weight="700" text-anchor="middle">MELBOURNE</text>
    <line x1="8" y1="39.5" x2="312" y2="39.5" class="hairline"/>
    <text x="306" y="56" class="label grey" font-size="10" text-anchor="end">PREVIEW TIME</text>

    <text x="160" y="112" class="mono" font-size="76" font-weight="700" text-anchor="middle"
          fill="#000" stroke="#fff" stroke-width="2.5" paint-order="stroke">9</text>
    <text x="160" y="190" class="mono white" font-size="76" font-weight="700" text-anchor="middle">41</text>
    <text x="289" y="89" class="label grey" font-size="14" text-anchor="end">PM</text>

    <!-- Preview-only legend for the clock's waiting-for-time state. -->
    <g transform="translate(202 200)">
      <rect width="108" height="31" rx="7" fill="#080808" stroke="#3c3c3c"/>
      <circle cx="17" cy="15.5" r="8" fill="none" stroke="#3c3c3c" stroke-width="2.5"/>
      <path d="M17 7.5 A8 8 0 0 1 25 15.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="31" y="14" class="label white" font-size="8" font-weight="700">WAIT STATE</text>
      <text x="31" y="24" class="label grey" font-size="7">Waiting for time</text>
    </g>
  </svg>

  <!-- SETTINGS — exact 320 x 240 panel -->
  <svg x="344" y="264" width="320" height="240" viewBox="0 0 320 240">
    <rect class="screen" x="0.5" y="0.5" width="319" height="239"/>
    <rect class="panel" x="8" y="6" width="66" height="28" rx="8"/>
    <text x="41" y="24" class="label white" font-size="12" text-anchor="middle">‹  HOME</text>
    <text x="160" y="25" class="label white" font-size="14" font-weight="700" text-anchor="middle">SETTINGS</text>
    <line x1="8" y1="39.5" x2="312" y2="39.5" class="hairline"/>

    <text x="16" y="68" class="label white" font-size="16" font-weight="700">BRIGHTNESS</text>
    <text x="304" y="68" class="label white" font-size="16" font-weight="700" text-anchor="end">80%</text>
    <rect x="16" y="78" width="288" height="18" rx="9" fill="#3c3c3c"/>
    <rect x="16" y="78" width="230" height="18" rx="9" fill="#fff"/>
    <circle cx="246" cy="87" r="14" fill="#fff"/>

    <rect class="panel" x="16" y="113" width="288" height="46" rx="10"/>
    <text x="160" y="142" class="label white" font-size="14" font-weight="700" text-anchor="middle">THEME     DARK</text>

    <rect class="panel" x="16" y="174" width="288" height="50" rx="10"/>
    <text x="160" y="205" class="label white" font-size="16" font-weight="700" text-anchor="middle">RESTART</text>
  </svg>
</svg>
