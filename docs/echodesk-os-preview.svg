<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="672" height="512" viewBox="0 0 672 512">
  <title>EchoDesk OS 1.0 — 320 by 240 screen previews</title>
  <desc>Four exact-aspect preview panels for Home, Codex Usage, Melbourne Clock, and Settings. Usage and clock values are explicitly marked as preview data.</desc>
  <style>
    .screen { fill: #000; stroke: #555; stroke-width: 1; }
    .panel { fill: #0e0e0e; stroke: #3c3c3c; stroke-width: 1; }
    .white { fill: #fff; }
    .grey { fill: #8a8a8a; }
    .dim { fill: #3c3c3c; }
    .label { font-family: Montserrat, Arial, sans-serif; }
    .mono { font-family: "Arial Narrow", Montserrat, Arial, sans-serif; }
    .hairline { stroke: #3c3c3c; stroke-width: 1; }
  </style>

  <rect width="672" height="512" fill="#151515"/>

  <!-- HOME — exact 320 x 240 panel -->
  <svg x="8" y="8" width="320" height="240" viewBox="0 0 320 240">
    <rect class="screen" x="0.5" y="0.5" width="319" height="239"/>

    <text x="12" y="28" class="label" font-size="20" font-weight="700"
          fill="#000" stroke="#fff" stroke-width="1.2" paint-order="stroke">ECHO</text>
    <text x="73" y="28" class="label white" font-size="20" font-weight="800" letter-spacing="1">DESK</text>
    <text x="308" y="23" class="label grey" font-size="12" text-anchor="end">OS  1.0</text>

    <g transform="translate(10 43)">
      <rect class="panel" width="300" height="56" rx="12"/>
      <rect x="8" y="8" width="40" height="40" rx="8" fill="none" stroke="#fff"/>
      <text x="28" y="34" class="label white" font-size="16" font-weight="700" text-anchor="middle">C</text>
      <text x="60" y="24" class="label white" font-size="16" font-weight="700">CODEX USAGE</text>
      <text x="60" y="43" class="label grey" font-size="12">Session and weekly limits</text>
      <text x="286" y="35" class="label grey" font-size="20" text-anchor="end">›</text>
    </g>

    <g transform="translate(10 105)">
      <rect class="panel" width="300" height="56" rx="12"/>
      <rect x="8" y="8" width="40" height="40" rx="8" fill="none" stroke="#fff"/>
      <text x="28" y="34" class="label white" font-size="16" font-weight="700" text-anchor="middle">12</text>
      <text x="60" y="24" class="label white" font-size="16" font-weight="700">CLOCK</text>
      <text x="60" y="43" class="label grey" font-size="12">Melbourne local time</text>
      <text x="286" y="35" class="label grey" font-size="20" text-anchor="end">›</text>
    </g>

    <g transform="translate(10 167)">
      <rect class="panel" width="300" height="56" rx="12"/>
      <rect x="8" y="8" width="40" height="40" rx="8" fill="none" stroke="#fff"/>
      <text x="28" y="35" class="label white" font-size="18" font-weight="700" text-anchor="middle">*</text>
      <text x="60" y="24" class="label white" font-size="16" font-weight="700">SETTINGS</text>
      <text x="60" y="43" class="label grey" font-size="12">Brightness and restart</text>
      <text x="286" y="35" class="label grey" font-size="20" text-anchor="end">›</text>
    </g>
  </svg>

  <!-- CODEX — exact 320 x 240 panel; all values are preview samples -->
  <svg x="344" y="8" width="320" height="240" viewBox="0 0 320 240">
    <rect class="screen" x="0.5" y="0.5" width="319" height="239"/>
    <g>
      <rect class="panel" x="8" y="6" width="66" height="28" rx="8"/>
      <text x="41" y="24" class="label white" font-size="12" text-anchor="middle">‹  HOME</text>
      <text x="160" y="25" class="label white" font-size="14" font-weight="700" text-anchor="middle">CODEX USAGE</text>
      <text x="310" y="23" class="label grey" font-size="10" text-anchor="end">PREVIEW DATA</text>
      <line x1="8" y1="39.5" x2="312" y2="39.5" class="hairline"/>
      <text x="10" y="53" class="label grey" font-size="11">PERCENT LEFT</text>
    </g>

    <g transform="translate(8 58)">
      <rect width="304" height="83" rx="10" fill="#0e0e0e"/>
      <text x="12" y="23" class="label white" font-size="14" font-weight="700">5-HOUR SESSION</text>
      <text x="292" y="36" class="label white" font-size="36" font-weight="700" text-anchor="end">27%</text>
      <rect x="12" y="45" width="280" height="8" rx="4" fill="#3c3c3c"/>
      <rect x="12" y="45" width="76" height="8" rx="4" fill="#fff"/>
      <text x="12" y="75" class="label grey" font-size="12">RESET IN  1h 42m</text>
    </g>

    <g transform="translate(8 149)">
      <rect width="304" height="83" rx="10" fill="#0e0e0e"/>
      <text x="12" y="23" class="label white" font-size="14" font-weight="700">WEEKLY</text>
      <text x="292" y="36" class="label white" font-size="36" font-weight="700" text-anchor="end">38%</text>
      <rect x="12" y="45" width="280" height="8" rx="4" fill="#3c3c3c"/>
      <rect x="12" y="45" width="106" height="8" rx="4" fill="#fff"/>
      <text x="12" y="75" class="label grey" font-size="12">RESET IN  5d 2h</text>
    </g>
  </svg>

  <!-- CLOCK — exact 320 x 240 panel; shown time is a preview sample -->
  <svg x="8" y="264" width="320" height="240" viewBox="0 0 320 240">
    <rect class="screen" x="0.5" y="0.5" width="319" height="239"/>
    <rect class="panel" x="8" y="6" width="66" height="28" rx="8"/>
    <text x="41" y="24" class="label white" font-size="12" text-anchor="middle">‹  HOME</text>
    <text x="160" y="25" class="label white" font-size="14" font-weight="700" text-anchor="middle">MELBOURNE</text>
    <line x1="8" y1="39.5" x2="312" y2="39.5" class="hairline"/>
    <text x="306" y="56" class="label grey" font-size="10" text-anchor="end">PREVIEW TIME</text>

    <text x="160" y="112" class="mono" font-size="76" font-weight="700" text-anchor="middle"
          fill="#000" stroke="#fff" stroke-width="2.5" paint-order="stroke">9</text>
    <text x="160" y="190" class="mono white" font-size="76" font-weight="700" text-anchor="middle">41</text>
    <text x="289" y="89" class="label grey" font-size="14" text-anchor="end">PM</text>
  </svg>

  <!-- SETTINGS — exact 320 x 240 panel -->
  <svg x="344" y="264" width="320" height="240" viewBox="0 0 320 240">
    <rect class="screen" x="0.5" y="0.5" width="319" height="239"/>
    <rect class="panel" x="8" y="6" width="66" height="28" rx="8"/>
    <text x="41" y="24" class="label white" font-size="12" text-anchor="middle">‹  HOME</text>
    <text x="160" y="25" class="label white" font-size="14" font-weight="700" text-anchor="middle">SETTINGS</text>
    <line x1="8" y1="39.5" x2="312" y2="39.5" class="hairline"/>

    <text x="16" y="74" class="label white" font-size="16" font-weight="700">BRIGHTNESS</text>
    <text x="304" y="74" class="label white" font-size="16" font-weight="700" text-anchor="end">80%</text>
    <rect x="16" y="91" width="288" height="18" rx="9" fill="#3c3c3c"/>
    <rect x="16" y="91" width="230" height="18" rx="9" fill="#fff"/>
    <circle cx="246" cy="100" r="14" fill="#fff"/>

    <rect class="panel" x="16" y="155" width="288" height="58" rx="10"/>
    <text x="160" y="190" class="label white" font-size="16" font-weight="700" text-anchor="middle">RESTART</text>
  </svg>
</svg>
